[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heteroservebench"
version = "0.1.0"
description = "Infrastructure for HeteroServeBench: SLO-constrained LLM inference benchmarking."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gpu = ["vllm>=0.6.0"]

[tool.setuptools.packages.find]
include = ["heteroservebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
